# Builds, tests and packages RingDeck from this repository alone, on GitHub's Windows machines.
# Tag a commit "v<version>" (matching <Version> in Directory.Build.props) to publish a release.
# Signing: once SignPath has accepted the project, add the secret SIGNPATH_API_TOKEN and the variables
# SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and SIGNPATH_SIGNING_POLICY_SLUG (Settings > Secrets and variables
# > Actions). Until then the workflow still builds and publishes, just unsigned.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create releases on tags
  actions: read     # SignPath reads the uploaded artifact

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      # wix314-binaries.zip from github.com/wixtoolset/wix3 release wix3141rtm
      WIX_ZIP_SHA256: 6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Unit tests
        run: dotnet test RingDeck.Core.Tests -c Release

      - name: Read version
        id: version
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:IS_RELEASE -eq 'true' -and "v$v" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match <Version>$v</Version> in Directory.Build.props"
          }

      - name: Publish RingDeck.exe
        run: >
          dotnet publish RingDeck.App -c Release -r win-x64 --self-contained true -o publish
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true

      - name: Installer artwork
        run: python -I make_art.py

      - name: Get WiX 3.14
        run: |
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile wix.zip
          if ((Get-FileHash wix.zip -Algorithm SHA256).Hash -ne $env:WIX_ZIP_SHA256) { throw "The WiX download does not match the expected checksum" }
          Expand-Archive wix.zip -DestinationPath wix

      - name: Build the MSI
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force stage/bin, dist | Out-Null
          Copy-Item publish/RingDeck.exe, THIRD-PARTY-NOTICES.txt stage/bin/
          Copy-Item installer/RingDeck.wxs, installer/banner.bmp, installer/dialog.bmp, ringdeck.ico stage/
          Push-Location stage
          ../wix/candle.exe -nologo -arch x64 -ext WixUtilExtension "-dVersion=$v" -dBinDir=bin -out RingDeck.wixobj RingDeck.wxs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ../wix/light.exe -nologo -sval -ext WixUIExtension -ext WixUtilExtension -cultures:en-us -out "../dist/RingDeck-$v.msi" RingDeck.wixobj
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          Get-ChildItem dist

      - name: Build the Microsoft Store package (MSIX)
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe (Windows SDK) not found on this runner" }
          New-Item -ItemType Directory -Force msix/Assets | Out-Null
          Copy-Item publish/RingDeck.exe, THIRD-PARTY-NOTICES.txt msix/
          Copy-Item installer/msix/Assets/*.png msix/Assets/
          (Get-Content installer/msix/AppxManifest.xml -Raw).Replace('__VERSION__', "$v.0") | Set-Content msix/AppxManifest.xml -Encoding utf8
          & $makeappx.FullName pack /d msix /p "dist/RingDeck-$v.msix" /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload the Store package
        uses: actions/upload-artifact@v4
        with:
          name: RingDeck-${{ steps.version.outputs.version }}-store
          path: dist/*.msix
          if-no-files-found: error

      - name: Upload the unsigned MSI
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: RingDeck-${{ steps.version.outputs.version }}-unsigned
          path: dist/*.msi
          if-no-files-found: error

      - name: Sign with SignPath
        if: env.HAS_SIGNPATH == 'true' && (env.IS_RELEASE == 'true' || github.event_name == 'workflow_dispatch')
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # release signing may wait for a manual approval
          output-artifact-directory: signed

      - name: Upload the signed MSI
        if: env.HAS_SIGNPATH == 'true' && (env.IS_RELEASE == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: RingDeck-${{ steps.version.outputs.version }}
          path: signed/*.msi
          if-no-files-found: error

      - name: Publish the release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $msi = if (Test-Path signed/*.msi) { Get-Item signed/*.msi } else { Get-Item dist/*.msi }
          gh release view $tag *> $null
          if ($LASTEXITCODE) { gh release create $tag --title "RingDeck $tag" --generate-notes --verify-tag }
          gh release upload $tag $msi.FullName --clobber
          gh release upload $tag (Get-Item dist/*.msix).FullName --clobber
